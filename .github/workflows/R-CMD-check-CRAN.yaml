# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# (check-standard.yaml), reduced to one job that runs the check the way CRAN
# does: NOT_CRAN=false, so tests/examples guarded by skip_on_cran() also run
# as on CRAN.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check-CRAN

permissions: read-all

jobs:
  R-CMD-check-CRAN:
    runs-on: ${{ matrix.config.os }}

    name: CRAN-like ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
        env:
          _R_CHECK_CRAN_INCOMING_: false
          NOT_CRAN: false
